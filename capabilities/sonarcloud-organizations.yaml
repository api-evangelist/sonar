naftiko: 1.0.0-alpha2
info:
  label: SonarCloud API — Organizations
  description: 'SonarCloud API — Organizations. 1 operations. Lead operation: Search Organizations. Self-contained Naftiko
    capability covering one Sonar business surface.'
  tags:
  - Sonar
  - Organizations
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SONAR_API_KEY: SONAR_API_KEY
capability:
  consumes:
  - type: http
    namespace: sonarcloud-organizations
    baseUri: https://sonarcloud.io/api
    description: SonarCloud API — Organizations business capability. Self-contained, no shared references.
    resources:
    - name: organizations-search
      path: /organizations/search
      operations:
      - name: searchorganizations
        method: GET
        description: Search Organizations
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: q
          in: query
          type: string
          description: Search query to filter organizations by name or key
        - name: p
          in: query
          type: integer
          description: Page number
        - name: ps
          in: query
          type: integer
          description: Page size (max 500)
    authentication:
      type: bearer
      token: '{{env.SONAR_API_KEY}}'
  exposes:
  - type: rest
    namespace: sonarcloud-organizations-rest
    port: 8080
    description: REST adapter for SonarCloud API — Organizations. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/organizations/search
      name: organizations-search
      description: REST surface for organizations-search.
      operations:
      - method: GET
        name: searchorganizations
        description: Search Organizations
        call: sonarcloud-organizations.searchorganizations
        with:
          q: rest.q
          p: rest.p
          ps: rest.ps
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: sonarcloud-organizations-mcp
    port: 9090
    transport: http
    description: MCP adapter for SonarCloud API — Organizations. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: search-organizations
      description: Search Organizations
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: sonarcloud-organizations.searchorganizations
      with:
        q: tools.q
        p: tools.p
        ps: tools.ps
      outputParameters:
      - type: object
        mapping: $.
