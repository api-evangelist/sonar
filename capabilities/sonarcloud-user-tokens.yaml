naftiko: 1.0.0-alpha2
info:
  label: SonarCloud API — User Tokens
  description: 'SonarCloud API — User Tokens. 2 operations. Lead operation: Generate User Token. Self-contained Naftiko capability
    covering one Sonar business surface.'
  tags:
  - Sonar
  - User Tokens
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SONAR_API_KEY: SONAR_API_KEY
capability:
  consumes:
  - type: http
    namespace: sonarcloud-user-tokens
    baseUri: https://sonarcloud.io/api
    description: SonarCloud API — User Tokens business capability. Self-contained, no shared references.
    resources:
    - name: user_tokens-generate
      path: /user_tokens/generate
      operations:
      - name: generateusertoken
        method: POST
        description: Generate User Token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: user_tokens-search
      path: /user_tokens/search
      operations:
      - name: searchusertokens
        method: GET
        description: Search User Tokens
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SONAR_API_KEY}}'
  exposes:
  - type: rest
    namespace: sonarcloud-user-tokens-rest
    port: 8080
    description: REST adapter for SonarCloud API — User Tokens. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/user-tokens/generate
      name: user-tokens-generate
      description: REST surface for user_tokens-generate.
      operations:
      - method: POST
        name: generateusertoken
        description: Generate User Token
        call: sonarcloud-user-tokens.generateusertoken
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/user-tokens/search
      name: user-tokens-search
      description: REST surface for user_tokens-search.
      operations:
      - method: GET
        name: searchusertokens
        description: Search User Tokens
        call: sonarcloud-user-tokens.searchusertokens
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: sonarcloud-user-tokens-mcp
    port: 9090
    transport: http
    description: MCP adapter for SonarCloud API — User Tokens. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: generate-user-token
      description: Generate User Token
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: sonarcloud-user-tokens.generateusertoken
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: search-user-tokens
      description: Search User Tokens
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: sonarcloud-user-tokens.searchusertokens
      outputParameters:
      - type: object
        mapping: $.
