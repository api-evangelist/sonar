aid: sonar
name: Sonar
description: >-
  Sonar (SonarSource) provides code quality and security analysis tools for developers. Products include SonarQube
  (self-hosted), SonarCloud (cloud-hosted), and SonarLint (IDE plugin), offering continuous inspection through static
  code analysis across 30+ programming languages.
